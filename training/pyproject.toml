[project]
name = "kamikaze-train"
version = "0.1.0"
description = "PPO trainer for the InterceptAviary"
requires-python = ">=3.11,<3.12"
dependencies = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "gymnasium>=0.29",
    "tensorboard>=2.16",
    "kamikaze-common[envs]",
    # gym-pybullet-drones is pinned to a known-good commit by KAM-9.
    # KAM-5 leaves it commented to avoid broken install on the laptop;
    # the 3090 box adds it explicitly.
    # "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones@<sha>",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kamikaze_train"]
