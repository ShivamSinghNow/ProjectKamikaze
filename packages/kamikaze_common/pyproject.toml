[project]
name = "kamikaze-common"
version = "0.1.0"
description = "Shared schemas, logging, and gym envs for ProjectKamikaze"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# Pulled in by the training package — keeps the drone-agent image lean
# when it only needs schemas + logging.
envs = [
    "gymnasium>=0.29",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kamikaze_common"]
