[project]
name = "swarmsight"
version = "0.1.0"
description = "Counter-Shahed swarm drone perception"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "roboflow>=1.1.50",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.20",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.26",
    "kagglehub>=1.0.1",
    "gradio>=6.14.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
