# Source datasets. Anything matching `class_aliases` gets remapped to class 0 (shahed).
# Set `enabled: false` to skip a source. `modality` is rgb|ir.

target_class: shahed
output_format: yolov8

class_aliases:
  - shahed
  - shahed-136
  - shahed136
  - Shahed-136
  - Shahed_136
  - shahed_136
  - shahed-131
  - shahed131
  - "Shahed 136"
  - shahed-137
  - shahed137

sources:
