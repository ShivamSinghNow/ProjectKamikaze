[project]
name = "drone-agent"
version = "0.1.0"
description = "Per-drone runtime: perception + policy + mesh + sim"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "kamikaze-common",
]

[project.optional-dependencies]
# KAM-9 swap: enables PPOPolicy. Heavy (pulls torch). The `noop` default
# never imports stable_baselines3, so KAM-5 boots without these.
ppo = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "gymnasium>=0.29",
    "kamikaze-common[envs]",
]
# KAM-10: ONNX Runtime for YOLO26 inference
onnx = [
    "onnxruntime>=1.17",
]
# KAM-11: Redis-backed gossip mesh (websockets fallback also possible)
mesh = [
    "redis>=5.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_agent"]
