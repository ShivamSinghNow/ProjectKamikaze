[project]
name = "drone-agent"
version = "0.1.0"
description = "Per-drone runtime: perception + policy + mesh + sim"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    # redis + msgpack are required since KAM-8 — sim_client subscribes to
    # world:state and publishes drone:{id}:cmd. kamikaze-common already
    # pulls them transitively but listing here is explicit.
    "kamikaze-common",
]

[project.optional-dependencies]
# KAM-9 swap: enables PPOPolicy. Heavy (pulls torch). The `noop` default
# never imports stable_baselines3, so KAM-5 boots without these.
ppo = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "gymnasium>=0.29",
    "kamikaze-common[envs]",
]
# KAM-10: ONNX Runtime for YOLO26 inference
onnx = [
    "onnxruntime>=1.17",
]
# KAM-11: websockets gossip mesh fallback. Redis is already required for
# the sim dataplane (KAM-8) so KAM-11 only needs to pick a transport.
mesh = [
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_agent"]
