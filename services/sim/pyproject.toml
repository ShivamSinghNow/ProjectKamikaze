[project]
name = "kamikaze-sim"
version = "0.1.0"
description = "Headless central PyBullet sim for the Kamikaze swarm"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kamikaze-common[envs]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
